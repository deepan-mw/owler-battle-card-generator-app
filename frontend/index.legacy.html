<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Owler Battlecard Engine</title>
<style>
  :root{
    --bg:#0f1419; --card:#1a212b; --card2:#222b37; --line:#2c3744;
    --text:#e8edf2; --muted:#93a1b0; --accent:#3b82f6;
    --pos:#22c55e; --neg:#ef4444; --neu:#eab308; --chip:#2a3442;
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;
    gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{color:var(--muted);font-size:13px}
  .controls{margin-left:auto;display:flex;gap:8px}
  input,button{font:inherit;border-radius:8px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);padding:8px 12px}
  button{background:var(--accent);border-color:var(--accent);cursor:pointer;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  main{max-width:1100px;margin:0 auto;padding:24px}
  .meta-bar{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;
    margin-bottom:18px;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .card.wide{grid-column:1/-1}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .conf{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px}
  .bar{width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent)}
  .item{padding:10px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:none}
  .claim{font-weight:600;margin-bottom:3px}
  .evidence{color:var(--muted);font-size:13px}
  .chips{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;
    padding:2px 9px;font-size:11px;color:var(--muted)}
  .chip.src-owler{color:#a78bfa}.chip.src-media{color:#38bdf8}
  .chip.src-genai_lens{color:#f472b6}.chip.src-gong{color:#fb923c}
  .pill{font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line)}
  .pos{color:var(--pos)}.neg{color:var(--neg)}.neu{color:var(--neu)}
  .ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;font-size:14px}
  .ov-grid div span{color:var(--muted);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .news a{color:var(--text);text-decoration:none;font-weight:600}
  .news a:hover{color:var(--accent)}
  .news small{color:var(--muted)}
  .vis{display:flex;gap:20px;margin-top:8px}
  .vis .num{font-size:30px;font-weight:700}
  .empty{color:var(--muted);font-style:italic;font-size:13px}
  .err{background:#3a1d1d;border:1px solid #5b2626;color:#fca5a5;padding:12px 16px;
    border-radius:10px;margin-bottom:16px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🦉 Owler Battlecard Engine</h1>
    <div class="sub">Live competitive battlecard · Owler · Meltwater media · GenAI Lens · Gong</div>
  </div>
  <div class="controls">
    <input id="domain" value="salesforce.com" size="16" />
    <input id="vs" value="HubSpot" size="10" placeholder="vs (us)" />
    <button id="go">Generate</button>
  </div>
</header>
<main>
  <div id="status"></div>
  <div id="board"></div>
</main>
<script>
const API = (localStorage.getItem("bc_api") || "http://localhost:8000") + "/battlecard";
const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sclass = s => s==="positive"||s==="up"?"pos":s==="negative"||s==="down"?"neg":"neu";

function conf(v){
  if(v==null) return "";
  const pct = Math.round(v*100);
  return `<span class="conf"><span class="bar"><i style="width:${pct}%"></i></span>${pct}%</span>`;
}
function chips(attr){
  if(!attr||!attr.length) return "";
  return `<div class="chips">`+attr.map(a=>
    `<span class="chip src-${esc(a.source)}">${esc(a.source)}${a.label?": "+esc(a.label):""}</span>`).join("")+`</div>`;
}
function claimSection(title,sec){
  const items=(sec.items||[]).map(i=>`<div class="item">
      <div class="claim">${esc(i.claim||i.objection)}</div>
      ${i.evidence?`<div class="evidence">${esc(i.evidence)}</div>`:""}
      ${i.talk_track?`<div class="evidence"><b>Talk track:</b> ${esc(i.talk_track)}</div>`:""}
      ${i.frequency?`<div class="evidence">Seen in ${i.frequency} calls</div>`:""}
      ${chips(i.attribution)}
    </div>`).join("") || `<div class="empty">No items.</div>`;
  return `<div class="card"><h2>${title}${conf(sec.section_confidence)}</h2>${items}</div>`;
}

function render(c){
  const o=c.company_overview, s=c.sections, m=c.meta;
  const ov=[["Description",o.description],["Revenue",o.revenue],["Headcount",o.headcount],
    ["HQ",o.hq],["Founded",o.founded],["CEO",o.ceo]]
    .map(([k,v])=>`<div><span>${k}</span>${esc(v??"—")}</div>`).join("");
  const comp=(o.top_competitors||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join("");
  const ai=s.ai_perception;
  const models=(ai.model_breakdown||[]).map(x=>`<div class="item">
      <div class="claim">${esc(x.model)} ${x.rank_for_category?`· #${x.rank_for_category}`:""}</div>
      <div class="evidence">${esc(x.characterization)}</div></div>`).join("");
  const news=(s.news_feed.items||[]).map(a=>`<div class="item news">
      <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.headline)}</a>
      <div><small>${esc(a.source||"")} · ${esc((a.published_at||"").slice(0,10))}
      ${a.topic_tag?`· ${esc(a.topic_tag)}`:""}</small>
      ${a.sentiment?` <span class="pill ${sclass(a.sentiment)}">${esc(a.sentiment)}</span>`:""}</div>
    </div>`).join("") || `<div class="empty">No recent coverage.</div>`;

  $("#board").innerHTML = `
    <div class="meta-bar">
      <strong style="font-size:16px;color:var(--text)">${esc(m.company_name)}</strong>
      ${m.vs_company?`<span>vs ${esc(m.vs_company)}</span>`:""}
      <span>Confidence ${Math.round((m.overall_confidence||0)*100)}%</span>
      <span>Sources: ${(m.data_sources_used||[]).join(", ")}</span>
      <span>Generated ${esc((m.generated_at||"").replace("T"," ").replace("Z"," UTC"))}</span>
    </div>
    <div class="grid">
      <div class="card wide"><h2>Company Overview${conf(m.overall_confidence)}</h2>
        <div class="ov-grid">${ov}</div>
        <div class="chips" style="margin-top:12px">${comp}</div></div>
      ${claimSection("Strengths",s.strengths)}
      ${claimSection("Weaknesses",s.weaknesses)}
      ${claimSection("Objections &amp; Talk Tracks",s.objections)}
      <div class="card"><h2>AI Perception${conf(ai.section_confidence)}</h2>
        <div class="evidence">${esc(ai.summary)}</div>
        <div class="vis">
          <div><span class="evidence">Them</span><div class="num">${ai.visibility_score??"—"}</div></div>
          <div><span class="evidence">Us</span><div class="num">${ai.vs_visibility_score??"—"}</div></div>
        </div>${models}${chips(ai.attribution)}</div>
      <div class="card wide"><h2>News Feed${conf(s.news_feed.section_confidence)}</h2>
        <div class="meta-bar" style="margin:0 0 6px">
          ${s.news_feed.sentiment_summary?`<span class="pill ${sclass(s.news_feed.sentiment_summary)}">sentiment: ${esc(s.news_feed.sentiment_summary)}</span>`:""}
          ${s.news_feed.volume_trend?`<span class="pill ${sclass(s.news_feed.volume_trend)}">volume ${esc(s.news_feed.volume_trend)}</span>`:""}
        </div>${news}</div>
    </div>`;
}

async function load(){
  const d=$("#domain").value.trim(), vs=$("#vs").value.trim();
  $("#go").disabled=true; $("#status").innerHTML=`<div class="empty">Generating battlecard for ${esc(d)}…</div>`;
  try{
    const u=new URL(API); u.searchParams.set("domain",d); if(vs) u.searchParams.set("vs",vs);
    const r=await fetch(u); if(!r.ok) throw new Error(`API ${r.status}: ${(await r.json()).detail||r.statusText}`);
    $("#status").innerHTML=""; render(await r.json());
  }catch(e){
    $("#status").innerHTML=`<div class="err">${esc(e.message)}<br><small>Start the API: <code>uvicorn api:app --reload</code> (set a different base with <code>localStorage.bc_api</code>). Loading bundled sample instead.</small></div>`;
    try{ render(await (await fetch("../battlecard.example.json")).json()); }catch(_){}
  }finally{ $("#go").disabled=false; }
}
$("#go").addEventListener("click",load);
$("#domain").addEventListener("keydown",e=>{if(e.key==="Enter")load();});
load();
</script>
</body>
</html>
