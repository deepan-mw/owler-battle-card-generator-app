<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Battle Cards Generator</title>
<style>
  :root{
    /* Owler-inspired dark: deep teal-navy + signature teal accent */
    --bg:#0a1620; --bg2:#07101a; --card:#10202b; --card2:#162b38; --line:#23404b;
    --text:#e7f1f1; --muted:#8aa6a8; --faint:#5d7479; --accent:#0BA2A2; --accent2:#22d3d3;
    --pos:#22c55e; --neg:#ef4444; --neu:#eab308; --chip:#162b38;
    --owler:#0BA2A2; --media:#22d3d3; --genai_lens:#5d5fef; --gong:#f59e0b;
    --shadow:0 8px 30px rgba(0,0,0,.35); --radius:16px;
  }
  [data-theme="light"]{
    /* Owler.com: white surfaces, teal primary (#0BA2A2), deep indigo (#0C1B88) */
    --bg:#ffffff; --bg2:#f5f8f8; --card:#ffffff; --card2:#f1f6f6; --line:#e3eaea;
    --text:#262626; --muted:#5f6b6b; --faint:#9aa6a6; --accent:#0BA2A2; --accent2:#0C1B88;
    --chip:#eaf4f4; --owler:#0BA2A2; --media:#0C1B88; --genai_lens:#5d5fef; --gong:#f59e0b;
    --shadow:0 6px 24px rgba(12,27,136,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:radial-gradient(1200px 600px at 80% -10%, rgba(11,162,162,.12), transparent 60%),var(--bg);
    color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit}

  /* ---------- Header ---------- */
  header{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);
    background:color-mix(in srgb,var(--bg) 78%,transparent);
    border-bottom:1px solid var(--line);padding:14px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;
    background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);overflow:hidden}
  .brand .logo img{width:100%;height:100%;object-fit:contain}
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
  .brand .sub{color:var(--muted);font-size:12px}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .field{position:relative;display:flex;align-items:center}
  .field svg{position:absolute;left:10px;width:15px;height:15px;color:var(--faint);pointer-events:none}
  input{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card2);
    color:var(--text);padding:9px 12px 9px 30px;width:150px;transition:border-color .15s,box-shadow .15s}
  input.vs{padding-left:12px;width:110px}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,162,162,.20)}
  button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card2);
    color:var(--text);padding:9px 13px;cursor:pointer;font-weight:600;display:inline-flex;
    align-items:center;gap:6px;transition:filter .15s,transform .05s,background .15s}
  button:hover{filter:brightness(1.08)} button:active{transform:translateY(1px)}
  button.primary{background:linear-gradient(135deg,#3b82f6,#6366f1);border-color:transparent;color:#fff}
  button.icon{padding:9px 10px}
  button:disabled{opacity:.5;cursor:default}
  button.mode{position:relative;padding-left:26px}
  button.mode::before{content:"";position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.2)}
  button.mode[data-mode="live"]::before{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
  .banner{margin:0 0 16px;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);color:var(--muted)}
  .banner.demo{border-color:#f59e0b55;background:#f59e0b1a;color:#b45309}
  .banner.live{border-color:rgba(11,162,162,.4);background:rgba(11,162,162,.12);color:#0a6b6b}
  [data-theme="dark"] .banner.demo{color:#fbbf24} [data-theme="dark"] .banner.live{color:#3fd6d6}

  main{max-width:1180px;margin:0 auto;padding:22px 24px 60px}

  /* ---------- Hero ---------- */
  .hero{display:flex;gap:22px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px;flex-wrap:wrap}
  .avatar{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;font-size:26px;font-weight:800;
    color:#fff;flex-shrink:0}
  .hero-main{flex:1;min-width:220px}
  .hero-main h2{margin:0 0 3px;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hero-main .desc{color:var(--muted);font-size:14px;max-width:620px}
  .vs-badge{font-size:12px;font-weight:600;color:var(--accent2);background:color-mix(in srgb,var(--accent) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);padding:3px 10px;border-radius:20px}
  .sim-badge{font-size:11px;font-weight:700;color:var(--neu);background:color-mix(in srgb,var(--neu) 15%,transparent);
    border:1px solid color-mix(in srgb,var(--neu) 45%,transparent);padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .ring{flex-shrink:0;text-align:center}
  .ring svg{transform:rotate(-90deg)}
  .ring .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .ring .pctxt{font-size:20px;font-weight:800}

  /* ---------- Source legend / tabs ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);
    padding:5px;border-radius:13px}
  .tab{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
    border:none;background:transparent;transition:all .15s}
  .tab:hover{color:var(--text)}
  .tab.active{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(59,130,246,.35)}
  .src-legend{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .src-legend span{display:inline-flex;align-items:center;gap:5px}
  .src-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

  /* ---------- Cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
    box-shadow:var(--shadow);animation:rise .4s ease both}
  .card.wide{grid-column:1/-1}
  .card.hidden{display:none}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
    margin:0 0 14px;display:flex;align-items:center;gap:10px;font-weight:700}
  .card h3 .ic{font-size:15px}
  .conf{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
  .bar{width:60px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;width:0;border-radius:4px;
    background:linear-gradient(90deg,#3b82f6,#8b5cf6);transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .bar.lo > i{background:linear-gradient(90deg,#f59e0b,#ef4444)}

  .item{padding:13px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:none;padding-top:0}
  .claim{font-weight:600;margin-bottom:4px}
  .evidence{color:var(--muted);font-size:13.5px}
  .evidence b{color:var(--text)}
  .freq{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--accent2);margin-top:5px}
  .chips{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:3px 10px;
    font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .chip i{width:7px;height:7px;border-radius:50%}
  .pill{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);font-weight:600}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .neu{color:var(--neu)}
  .pill.pos{background:color-mix(in srgb,var(--pos) 14%,transparent);border-color:color-mix(in srgb,var(--pos) 40%,transparent)}
  .pill.neg{background:color-mix(in srgb,var(--neg) 14%,transparent);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
  .pill.neu{background:color-mix(in srgb,var(--neu) 14%,transparent);border-color:color-mix(in srgb,var(--neu) 40%,transparent)}

  /* overview */
  .ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;font-size:14px}
  .ov-grid div span{color:var(--faint);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .ov-grid div b{font-weight:600}

  /* ai perception */
  .vis{display:flex;gap:26px;margin:6px 0 14px}
  .vis .num{font-size:34px;font-weight:800;line-height:1}
  .vis small{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
  .vbar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
  .vbar > i{display:block;height:100%;width:0;border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}

  /* news */
  .news-ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .fbtn{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--card2);
    color:var(--muted);cursor:pointer;font-weight:600}
  .fbtn.active{background:var(--accent);color:#fff;border-color:transparent}
  .news a.hl{font-weight:600;text-decoration:none}
  .news a.hl:hover{color:var(--accent2)}
  .news small{color:var(--faint)}

  .empty{color:var(--faint);font-style:italic;font-size:13px;padding:6px 0}
  .err{background:color-mix(in srgb,var(--neg) 12%,transparent);border:1px solid color-mix(in srgb,var(--neg) 40%,transparent);
    color:var(--neg);padding:13px 16px;border-radius:12px;margin-bottom:16px;font-size:13.5px}
  .err code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}

  /* skeleton */
  .sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 37%,var(--card) 63%);
    background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

  .vsword{font-size:12px;font-weight:700;color:var(--muted);opacity:.7}
  /* ---- dashboard: KPI strip + stats row ---- */
  .kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
  .kpi .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .kpi .tile .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .kpi .tile .v{font-size:21px;font-weight:700;margin-top:3px;letter-spacing:-.01em}
  .kpi .tile .v small{font-size:12px;color:var(--faint);font-weight:600}
  .stats{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;margin-bottom:14px}
  .stats .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}
  .stats .panel h4{margin:0 0 13px;font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
  .donut{display:flex;align-items:center;gap:16px}
  .dleg{font-size:12px;line-height:1.95} .dleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle}
  .dleg b{font-weight:700}
  .sconf .row{display:flex;align-items:center;gap:9px;margin-bottom:11px} .sconf .row:last-child{margin-bottom:0}
  .sconf .l{font-size:11px;color:var(--muted);width:86px}
  .sconf .t{flex:1;height:7px;background:var(--card2);border-radius:999px;overflow:hidden}
  .sconf .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0BA2A2,#0C1B88);transition:width .6s ease}
  .sconf .p{font-size:11px;font-weight:700;width:32px;text-align:right}
  .mvis .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .mvis .row:last-child{border-bottom:0} .mvis .rk{font-weight:700;color:var(--accent)} .mvis .rk.lo{color:var(--muted)}
  @media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr}}
  /* ---- VS battle card ---- */
  :root{--blue:#0BA2A2;--blueA:rgba(11,162,162,.16);--red:#5fcbc5;--redA:rgba(95,203,197,.18);--win:#16a34a}
  .arena{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);margin-bottom:14px}
  .corners{display:grid;grid-template-columns:1fr 92px 1fr}
  .corner{padding:20px 18px;display:flex;align-items:center;gap:13px}
  .corner .av{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .corner h3{margin:0;font-size:18px;color:#fff;letter-spacing:-.01em} .corner small{font-size:12px}
  .corner.blue{background:linear-gradient(135deg,#0BA2A2,#077575)} .corner.blue small{color:#b8eaea}
  .corner.red{background:linear-gradient(135deg,#a9e7e2,#7fd6d0);flex-direction:row-reverse;text-align:right}
  .corner.red h3{color:#06443f} .corner.red small{color:#0a605a}
  .corner.red .av{background:#0BA2A2;color:#fff} .corner.blue .av{background:#fff;color:#077575}
  .vsbig{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card2);position:relative}
  .vsorb{width:46px;height:46px;border-radius:50%;background:var(--card);border:2px solid var(--accent);
    color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;letter-spacing:.02em}
  .vsbig small{font-size:9px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin-top:7px;text-align:center}
  .tape-h{text-align:center;font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:700;padding:13px 0 4px}
  .tape{padding:2px 18px 14px}
  .trow{display:grid;grid-template-columns:1fr 132px 1fr;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .trow:last-child{border-bottom:0}
  .tside{display:flex;align-items:center;gap:9px} .tside.l{justify-content:flex-end}
  .tside .v{font-size:15px;font-weight:800;white-space:nowrap} .tside .v.win{color:var(--win)}
  .tbar{width:74px;height:8px;border-radius:999px;background:var(--card2);overflow:hidden;display:flex}
  .tbar.l{justify-content:flex-end} .tbar i{display:block;height:100%} .tbar.l i{background:var(--blue)} .tbar.r i{background:var(--red)}
  .tlab{text-align:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .dot{font-size:13px} .dot.on{color:var(--win)} .dot.off{color:var(--faint)}
  .combat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden}
  .ccard .top{padding:11px 15px;font-weight:800;font-size:13px;color:#fff;display:flex;align-items:center;gap:8px}
  .ccard.blue .top{background:linear-gradient(135deg,#0BA2A2,#077575)}
  .ccard.red .top{background:linear-gradient(135deg,#a9e7e2,#7fd6d0);color:#06443f}
  .ccard .body{padding:14px 15px}
  .bl{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin:0 0 7px}
  .bl.atk{color:#22c55e} .bl.vuln{color:#f59e0b} .bl.obj{color:var(--accent2)}
  .bl.mt{margin-top:14px}
  .blist{list-style:none;margin:0;padding:0} .blist li{font-size:13px;line-height:1.5;padding:5px 0 5px 16px;position:relative}
  .blist li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
  .blist li .ev{color:var(--muted);font-size:12px;padding-left:0}
  .blist.atk li{color:#34d399} .blist.vuln li{color:#fbbf24} .blist li b{color:var(--text);font-weight:600}
  .verdict{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;
    background:color-mix(in srgb,var(--win) 16%,transparent);color:var(--win);border:1px solid color-mix(in srgb,var(--win) 40%,transparent)}
  @media(max-width:760px){.combat{grid-template-columns:1fr}.corners{grid-template-columns:1fr 60px 1fr}.corner h3{font-size:15px}}
  /* ---- head-to-head compare ---- */
  .vs-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:18px}
  .vs-co{display:flex;align-items:center;gap:10px}
  .vs-co.b{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
  .vs-co .av{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:18px}
  .vs-co h3{margin:0;font-size:16px} .vs-co small{color:var(--muted)}
  .vs-pill{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  .vs-row{display:grid;grid-template-columns:1fr 116px 1fr;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .vs-row .lab{text-align:center;font-size:12px;color:var(--muted)}
  .vs-side{display:flex;align-items:center;gap:9px}
  .vs-side.l{justify-content:flex-end} .vs-side .v{font-size:14px;font-weight:700;white-space:nowrap}
  .vs-bar{width:96px;height:9px;border-radius:999px;background:var(--card2);overflow:hidden;display:flex}
  .vs-bar.l{justify-content:flex-end} .vs-bar i{height:100%;display:block}
  .vs-bar.l i{background:#3b82f6} .vs-bar.r i{background:#f59e0b}
  .vs-win{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--card2);color:var(--muted)}
  .vs-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .vs-cols h4{margin:0 0 9px;font-size:13px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
  .vs-list{list-style:none;margin:0;padding:0} .vs-list li{font-size:13px;line-height:1.5;padding:5px 0;border-bottom:1px dashed var(--line)}
  .vs-list li:last-child{border-bottom:0} .vs-list .ev{color:var(--muted);font-size:12px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}.ov-grid{grid-template-columns:repeat(2,1fr)}
    input{width:120px}.src-legend{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><img id="owlerLogo" alt="Owler" /></div>
    <div>
      <h1>Battle Cards Generator</h1>
      <div class="sub">Powered by Owler · Meltwater media · GenAI Lens · Gong</div>
    </div>
  </div>
  <div class="controls">
    <span class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="domain" value="salesforce.com" placeholder="company A domain" list="demoCos" />
    </span>
    <span class="vsword">vs</span>
    <input id="vs" class="vs" value="hubspot.com" placeholder="company B (optional)" list="demoCos" />
    <datalist id="demoCos">
      <option value="salesforce.com"></option><option value="hubspot.com"></option>
      <option value="microsoft.com"></option><option value="klue.com"></option>
    </datalist>
    <button id="go" class="primary">Generate</button>
    <button id="mode" class="mode" title="Toggle data source">Demo</button>
    <button id="export" class="icon" title="Download JSON" disabled>⬇</button>
    <button id="theme" class="icon" title="Toggle theme">🌙</button>
  </div>
</header>
<main>
  <div id="status"></div>
  <div id="board"></div>
</main>
<script>
const API = (localStorage.getItem("bc_api") || "http://localhost:8000") + "/battlecard";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ---- helpers ---- */
function confBar(v){
  if(v==null) return "";
  const pct=Math.round(v*100);
  return `<span class="conf"><span class="bar ${v<0.5?'lo':''}"><i data-w="${pct}"></i></span>${pct}%</span>`;
}
function ring(v){
  const pct=Math.round((v||0)*100), r=30, c=2*Math.PI*r, off=c*(1-(v||0));
  const col=v>=0.66?"#22c55e":v>=0.4?"#eab308":"#ef4444";
  return `<div class="ring"><svg width="76" height="76" viewBox="0 0 76 76">
    <circle cx="38" cy="38" r="${r}" stroke="var(--line)" stroke-width="7" fill="none"/>
    <circle cx="38" cy="38" r="${r}" stroke="${col}" stroke-width="7" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/>
    <text x="38" y="38" text-anchor="middle" dominant-baseline="central" transform="rotate(90 38 38)"
      class="pctxt" fill="var(--text)">${pct}%</text></svg>
    <div class="lbl">Confidence</div></div>`;
}
function chips(attr){
  if(!attr||!attr.length) return "";
  return `<div class="chips">`+attr.map(a=>
    `<span class="chip"><i style="background:var(--${esc(a.source)})"></i>${esc(SRCNAME[a.source]||a.source)}${a.label?": "+esc(a.label):""}</span>`).join("")+`</div>`;
}
function claimCard(id,title,ic,sec){
  const items=(sec.items||[]).map(i=>`<div class="item">
      <div class="claim">${esc(i.claim||i.objection)}</div>
      ${i.evidence?`<div class="evidence">${esc(i.evidence)}</div>`:""}
      ${i.talk_track?`<div class="evidence"><b>Talk track:</b> ${esc(i.talk_track)}</div>`:""}
      ${i.frequency?`<div class="freq">📞 seen in ${i.frequency} call${i.frequency==1?"":"s"}</div>`:""}
      ${chips(i.attribution)}
    </div>`).join("") || `<div class="empty">No items.</div>`;
  return `<div class="card sec" data-sec="${id}"><h3><span class="ic">${ic}</span>${title}${confBar(sec.section_confidence)}</h3>${items}</div>`;
}

/* ---- value formatters (identical output in Demo + Live, any source shape) ---- */
function fmtMoney(v){
  if(v==null||v==="") return null;
  if(typeof v==="number"){
    for(const [d,s] of [[1e9,"B"],[1e6,"M"],[1e3,"K"]]){ if(Math.abs(v)>=d) return "$"+(v/d).toFixed(1).replace(/\.0$/,"")+s; }
    return "$"+Math.round(v);
  }
  return String(v);
}
function fmtInt(v){ return (v==null||v==="")?null:(typeof v==="number"?v.toLocaleString():(isNaN(+v)?String(v):(+v).toLocaleString())); }

/* ---- consistent mode banner (same design in Demo + Live) ---- */
function bannerHtml(){return MODE==="demo"

  : `<div class="banner live"><span>🟢</span><span>Live data — pulled from connected sources. Unconnected sources show “—”.</span></div>`;}

/* ---- dashboard builders ---- */
function kpiStrip(o,m,ai,nf){
  const news = nf&&nf.items?nf.items.length:0;
  const tiles=[
    ["ti-cash","Revenue", fmtMoney(o.revenue)?esc(fmtMoney(o.revenue)):"—"],
    ["ti-users","Headcount", fmtInt(o.headcount)?esc(fmtInt(o.headcount)):"—"],
    ["ti-robot","AI visibility", (ai&&ai.visibility_score!=null)?`${ai.visibility_score}<small>/100</small>`:"—"],
    ["ti-news","News items", news||"—"],
    ["ti-shield-check","Confidence", m.overall_confidence!=null?`${Math.round(m.overall_confidence*100)}<small>%</small>`:"—"],
  ];
  return `<div class="kpi">`+tiles.map(([ic,k,v])=>
    `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")+`</div>`;
}
function donut(nf){
  let pos=0,neu=0,neg=0;
  (nf&&nf.items||[]).forEach(a=>{ if(a.sentiment==="positive")pos++; else if(a.sentiment==="negative")neg++; else neu++; });
  const tot=pos+neu+neg;
  if(!tot){ const s=nf&&nf.sentiment_summary; return `<div class="evidence">${s?esc(s):"No coverage data."}</div>`; }
  const segs=[["#22c55e","Positive",pos],["#eab308","Neutral",neu],["#ef4444","Negative",neg]];
  const C=2*Math.PI*15.9; let off=25; // start at top
  const arcs=segs.map(([col,,n])=>{ const frac=n/tot, len=frac*C;
    const seg=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${col}" stroke-width="6" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"></circle>`;
    off-=len; return seg; }).join("");
  const topPct=Math.round(pos/tot*100);
  const leg=segs.map(([col,lab,n])=>`<div><i style="background:${col}"></i>${lab} <b>${Math.round(n/tot*100)}%</b></div>`).join("");
  return `<div class="donut"><svg width="84" height="84" viewBox="0 0 42 42" style="transform:rotate(-90deg)">
      <circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--card2)" stroke-width="6"></circle>${arcs}</svg>
    <div class="dleg">${leg}</div></div>`;
}
function sectionConfidence(s){
  const rows=[["Strengths",s.strengths],["Weaknesses",s.weaknesses],["Objections",s.objections],
    ["AI perception",s.ai_perception],["News",s.news_feed]];
  return `<div class="sconf">`+rows.map(([l,sec])=>{
    const v=(sec&&sec.section_confidence)||0, p=Math.round(v*100);
    return `<div class="row"><span class="l">${l}</span><span class="t"><i data-w="${p}"></i></span><span class="p">${p}%</span></div>`;
  }).join("")+`</div>`;
}
function modelVis(ai){
  const mb=(ai&&ai.model_breakdown)||[];
  if(!mb.length) return `<div class="evidence">No AI model data.</div>`;
  return `<div class="mvis">`+mb.map(x=>{
    const r=x.rank_for_category;
    return `<div class="row"><span>${esc(x.model)}</span><span class="rk ${r&&r>1?'lo':''}">${r?'#'+r:'—'}</span></div>`;
  }).join("")+`</div>`;
}

function wireTabs(){
  $$(".tab").forEach(t=>t.addEventListener("click",()=>{
    $$(".tab").forEach(x=>x.classList.remove("active")); t.classList.add("active");
    const k=t.dataset.tab;
    $$(".sec").forEach(c=>c.classList.toggle("hidden",k!=="all"&&c.dataset.sec!==k));
  }));
}
function wireNews(){
  $$(".fbtn").forEach(b=>b.addEventListener("click",()=>{
    $$(".fbtn").forEach(x=>x.classList.remove("active")); b.classList.add("active");
    const f=b.dataset.filter;
    $$("#newslist .news").forEach(n=>n.style.display=(f==="all"||n.dataset.sent===f)?"":"none");
  }));
}

async function fetchCard(domain){
  const u=new URL(API); u.searchParams.set("domain",domain); u.searchParams.set("mode",MODE);
  const r=await fetch(u);
  if(!r.ok){let det;try{det=(await r.json()).detail;}catch(_){} throw new Error(`API ${r.status}: ${det||r.statusText}`);}
  return r.json();
}

async function load(){
  const a=$("#domain").value.trim(), b=$("#vs").value.trim();
  if(!a) return;
  const compare = b.includes(".");   // a second domain → head-to-head
  $("#go").disabled=true; $("#export").disabled=true;
  $("#status").innerHTML=""; skeleton();
  try{
    if(compare){
      const [ca,cb]=await Promise.all([fetchCard(a),fetchCard(b)]);
      renderCompare(ca,cb);
    }else{
      const u=new URL(API); u.searchParams.set("domain",a); if(b) u.searchParams.set("vs",b);
      u.searchParams.set("mode",MODE);
      const r=await fetch(u);
      if(!r.ok){let det;try{det=(await r.json()).detail;}catch(_){} throw new Error(`API ${r.status}: ${det||r.statusText}`);}
      render(await r.json());
    }
  }catch(e){
    $("#status").innerHTML=`<div class="err">${esc(e.message)}<br>
      <small>Start the API with <code>uvicorn api:app --reload</code> (override base via <code>localStorage.bc_api</code>). Showing bundled sample instead.</small></div>`;
    try{ render(await (await fetch("../battlecard.example.json")).json()); }catch(_){ $("#board").innerHTML=""; }
  }finally{ $("#go").disabled=false; }
}

/* ---- head-to-head comparison view ---- */
function avatar(name){const h=[...(name||"x")].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
  return {bg:`linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h+40)%360} 70% 45%))`,ch:(name||"?").trim().charAt(0).toUpperCase()};}
function revNum(s){if(!s)return 0;const m=String(s).match(/([\d.]+)\s*([BMK]?)/i);if(!m)return 0;
  return parseFloat(m[1])*({B:1e9,M:1e6,K:1e3,"":1}[(m[2]||"").toUpperCase()]);}

function vsRow(label,aTxt,bTxt,aVal,bVal,higherWins){
  const tot=(aVal+bVal)||1, ap=Math.round(aVal/tot*100), bp=100-ap;
  let aw="",bw=""; if(aVal!==bVal && higherWins!=null){
    const aWin=higherWins?aVal>bVal:aVal<bVal; aw=aWin?'<span class="vs-win">▲</span>':''; bw=aWin?'':'<span class="vs-win">▲</span>';}
  return `<div class="vs-row">
    <div class="vs-side l">${aw}<span class="v">${esc(aTxt)}</span><span class="vs-bar l r" style="--x:0"><i style="width:${ap}%;background:#3b82f6"></i></span></div>
    <div class="lab">${esc(label)}</div>
    <div class="vs-side"><span class="vs-bar r" ><i style="width:${bp}%;background:#f59e0b"></i></span><span class="v">${esc(bTxt)}</span>${bw}</div>
  </div>`;
}
function claimList(items){return `<ul class="vs-list">`+(items&&items.length?items.map(i=>
  `<li>${esc(i.claim)}${i.evidence?`<div class="ev">${esc(i.evidence)}</div>`:""}</li>`).join(""):`<li class="ev">—</li>`)+`</ul>`;}

function bWin(aVal,bVal,higherWins){ if(aVal===bVal||higherWins==null) return 0; return (higherWins?aVal>bVal:aVal<bVal)?1:-1; }
function tapeRow(label,aTxt,bTxt,aVal,bVal,higherWins,txt){
  const w=txt?0:bWin(aVal,bVal,higherWins), aw=w>0, bw=w<0;
  const tot=(aVal+bVal)||1, ap=Math.round(aVal/tot*100), bp=100-ap;
  return `<div class="trow">
    <div class="tside l"><span class="dot ${aw?'on':'off'}">${aw?'●':'○'}</span><span class="v ${aw?'win':''}">${esc(aTxt)}</span>
      <span class="tbar l"><i style="width:${txt?50:ap}%"></i></span></div>
    <div class="tlab">${esc(label)}</div>
    <div class="tside"><span class="tbar r"><i style="width:${txt?50:bp}%"></i></span>
      <span class="v ${bw?'win':''}">${esc(bTxt)}</span><span class="dot ${bw?'on':'off'}">${bw?'●':'○'}</span></div>
  </div>`;
}
function blist(items,cls){return `<ul class="blist ${cls}">`+(items&&items.length?items.map(i=>
  `<li><b>${esc(i.claim||i.objection)}</b>${(i.evidence||i.talk_track)?`<div class="ev">${esc(i.evidence||i.talk_track)}</div>`:""}</li>`).join(""):`<li class="ev">—</li>`)+`</ul>`;}

function renderCompare(ca,cb){
  CURRENT={compare:[ca,cb]};
  const A=ca.company_overview||{},B=cb.company_overview||{},ma=ca.meta||{},mb=cb.meta||{};
  const sa=ca.sections||{},sb=cb.sections||{};
  const avA=avatar(ma.company_name),avB=avatar(mb.company_name);
  const aiA=sa.ai_perception||{},aiB=sb.ai_perception||{},nfA=sa.news_feed||{},nfB=sb.news_feed||{};
  const sentN=s=>({positive:2,mixed:1,neutral:1,negative:0}[s]??1);
  const nA=ma.company_name||ma.company_domain||"A", nB=mb.company_name||mb.company_domain||"B";

  // tale of the tape rows (+tally winner per metric for the verdict)
  const rows=[
    ["Confidence",Math.round((ma.overall_confidence||0)*100)+"%",Math.round((mb.overall_confidence||0)*100)+"%",ma.overall_confidence||0,mb.overall_confidence||0,true,false],
    ["Revenue",fmtMoney(A.revenue)||"—",fmtMoney(B.revenue)||"—",revNum(A.revenue),revNum(B.revenue),true,false],
    ["Headcount",fmtInt(A.headcount)||"—",fmtInt(B.headcount)||"—",A.headcount||0,B.headcount||0,true,false],
    ["Founded",A.founded||"—",B.founded||"—",A.founded||0,B.founded||0,false,false],
    ["AI visibility",aiA.visibility_score??"—",aiB.visibility_score??"—",aiA.visibility_score||0,aiB.visibility_score||0,true,false],
    ["Sentiment",cap(nfA.sentiment_summary),cap(nfB.sentiment_summary),sentN(nfA.sentiment_summary),sentN(nfB.sentiment_summary),true,true],
  ];
  let wa=0,wb=0; rows.forEach(r=>{const w=r[6]?0:bWin(r[3],r[4],r[5]); if(w>0)wa++; else if(w<0)wb++;});
  const lead = wa===wb?`Evenly matched on key metrics`:`${wa>wb?esc(nA):esc(nB)} leads on ${Math.max(wa,wb)} of ${rows.length} metrics`;
  const banner = bannerHtml();

  $("#board").innerHTML=`${banner}
    <div class="arena">
      <div class="corners">
        <div class="corner blue"><div class="av">${esc(avA.ch)}</div>
          <div><h3>${esc(nA)}</h3><small>${esc(ma.company_domain||"")}</small></div></div>
        <div class="vsbig"><span class="vsorb">VS</span><small>HEAD-TO-HEAD</small></div>
        <div class="corner red"><div class="av">${esc(avB.ch)}</div>
          <div><h3>${esc(nB)}</h3><small>${esc(mb.company_domain||"")}</small></div></div>
      </div>
      <div class="tape-h">KEY METRICS</div>
      <div class="tape">${rows.map(r=>tapeRow(...r)).join("")}</div>
      <div style="text-align:center;padding:0 0 16px"><span class="verdict">${lead}</span></div>
    </div>

    <div class="combat">
      <div class="ccard blue"><div class="top">${esc(nA)}</div><div class="body">
        <p class="bl atk">Strengths</p>${blist((sa.strengths||{}).items,"atk")}
        <p class="bl vuln mt">Weaknesses</p>${blist((sa.weaknesses||{}).items,"vuln")}
      </div></div>
      <div class="ccard red"><div class="top">${esc(nB)}</div><div class="body">
        <p class="bl atk">Strengths</p>${blist((sb.strengths||{}).items,"atk")}
        <p class="bl vuln mt">Weaknesses</p>${blist((sb.weaknesses||{}).items,"vuln")}
      </div></div>
    </div>

    <div class="combat">
      <div class="ccard blue"><div class="top" style="background:var(--card2);color:var(--text)">Objection handling · ${esc(nA)}</div>
        <div class="body">${blist(((sa.objections||{}).items||[]).slice(0,4),"obj")}</div></div>
      <div class="ccard red"><div class="top" style="background:var(--card2);color:var(--text)">Objection handling · ${esc(nB)}</div>
        <div class="body">${blist(((sb.objections||{}).items||[]).slice(0,4),"obj")}</div></div>
    </div>

    <div class="vs-cols">
      <div class="panel"><h4><span class="ic">📊</span>News sentiment · ${esc(nA)}</h4>${donut(nfA)}</div>
      <div class="panel"><h4><span class="ic">📊</span>News sentiment · ${esc(nB)}</h4>${donut(nfB)}</div>
    </div>`;
  $("#export").disabled=false;
}
function cap(s){return s?String(s).charAt(0).toUpperCase()+String(s).slice(1):"—";}

$("#export").addEventListener("click",()=>{
  if(!CURRENT) return;
  const payload=CURRENT.compare?CURRENT.compare:CURRENT;
  const name=CURRENT.compare?`${CURRENT.compare[0].meta.company_domain}_vs_${CURRENT.compare[1].meta.company_domain}`:((CURRENT.meta&&CURRENT.meta.company_domain)||"export");
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`battlecard_${name}.json`; a.click();
  URL.revokeObjectURL(a.href);
});
$("#go").addEventListener("click",load);
["domain","vs"].forEach(id=>$("#"+id).addEventListener("keydown",e=>{if(e.key==="Enter")load();}));
load();
</script>
</body>
</html>
